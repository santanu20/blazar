[workspace]
resolver = "2"
members = [
    "crates/pallama-core",
    "crates/pallama-runtime",
    "crates/pallama-gateway",
    "crates/pallama-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libc = "0.2.189"
pallama-core = { path = "crates/pallama-core" }
pallama-runtime = { path = "crates/pallama-runtime" }
pallama-gateway = { path = "crates/pallama-gateway" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "multipart"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
toml = "0.9"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
dirs = "6"
rustyline = "15"
indicatif = "0.17"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "6"
http-body = "1"
tokio-stream = { version = "0.1", features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Internal crates: fallible fns return CoreError whose variants name the
# failure modes; per-fn "# Errors" doc sections are noise here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
# Full DWARF was eating 12G of target/; line tables keep backtraces
# line-accurate at a fraction of the size (disk hit 92%).
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
