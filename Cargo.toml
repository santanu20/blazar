[workspace]
resolver = "2"
members = [
    "crates/pallama-core",
    "crates/pallama-runtime",
    "crates/pallama-gateway",
    "crates/pallama-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/santanu/pallama"

[workspace.dependencies]
pallama-core = { path = "crates/pallama-core" }
pallama-runtime = { path = "crates/pallama-runtime" }
pallama-gateway = { path = "crates/pallama-gateway" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
dirs = "6"
rustyline = "15"
indicatif = "0.17"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "6"
bytes = "1"
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
