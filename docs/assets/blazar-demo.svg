<text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">blazar REPL — /help for commands</text>
<text x="24" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#a5d6ff">&gt; In one short sentence: why is a local inference server better</text>
<text x="24" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#a5d6ff">    than a cloud API for privacy?</text>
<text x="24" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3">A local inference server provides a more secure and consistent</text>
<text x="24" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3">privacy solution due to its decentralized architecture and local</text>
<text x="24" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3">processing capabilities, which can withstand cross-site scripting</text>
<text x="24" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3">(XSS) attacks and other types of malicious content.</text>
<text x="24" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#d29922">[profile]</text>
