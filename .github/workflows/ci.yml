name: ci

on:
  push:
    # main: the published export repo's branch; master: the dev tree.
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: fmt + clippy + workspace tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # F159: the codebase ships Windows/macOS code paths (tasklist
        # probes, .exe tool discovery, taskkill stop, detached spawn) —
        # a Linux-only matrix left them structurally untestable.
        # ubuntu-22.04 stays the glibc floor the release binaries target.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Tee the lint so a red matrix cell can be diagnosed from the
      # uploaded log instead of the truncated console (the API log
      # download needs admin rights fine-grained tokens don't carry).
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
        shell: bash
      - name: upload clippy log (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ matrix.os }}
          path: clippy.log
          if-no-files-found: ignore
      # Tests run via cargo-nextest: per-test process isolation is what the
      # suite is written for. Several e2e tests shape their stub engine via
      # STUB_* env vars (std::env::set_var) and spawn stub-llama-server
      # children that inherit them; under plain `cargo test` all tests share
      # one process, so a knob set by one test leaks into concurrently
      # running byte-exact tests. nextest gives every test its own process,
      # making the knobs deterministic — and matches how the suite is run
      # locally. It also runs test binaries in parallel on every OS, so the
      # old Windows serial pin is obsolete. No doc-tests exist in the
      # workspace, so nextest covers the full cargo-test surface.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace 2>&1 | tee test.log
        shell: bash
      - name: upload test log (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}
          path: test.log
          if-no-files-found: ignore

  scripts:
    name: shellcheck + installer e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86_64 runs everything; arm64 proves the aarch64 asset lane
        # (e2e cases 4+7 are x86_64-gated and skip there by design).
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/*.sh tests/install_e2e.sh
      # e2e installs real artifacts: host blazar binary + the stub engine
      # (stub only needed where case 4 runs — x86_64).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p blazar
      - run: |
          if [ "$(uname -m)" = x86_64 ]; then
            cargo build --release -p blazar-runtime --features test-util --bin stub-llama-server
          fi
      - run: sh tests/install_e2e.sh

  python:
    name: ruff + py_compile (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # F161: the harness had no CI lint gate — the F9 ruff errors lived
      # in the tree for months, uncatchable. Version is pinned so new
      # ruff releases cannot flip CI red overnight; ruff.toml freezes
      # the rule set, this freezes the binary.
      - run: python3 -m pip install ruff==0.16.8
      - run: ruff check scripts/
      - run: python3 -m py_compile scripts/*.py
      # Config doc drift: fails when a Config struct field has no row in
      # docs/config-code-paths.md (or vice versa). Pure stdlib (re/sys/
      # pathlib), so it runs on any runner python.
      - run: python3 scripts/check_config_doc_drift.py
      # Renderer self-test: campaign-scoped findings/frontier/index paths a
      # media-only artifact cannot reach; pure-fixture, no GPU needed.
      - run: python3 scripts/bench_render_selftest.py

  audit:
    name: cargo audit (dep CVEs)
    runs-on: ubuntu-latest
    # audit-check reports findings as a check-run annotation; the job-level
    # token must be allowed to write checks or the action errors out after a
    # clean scan ("Resource not accessible by integration").
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # F161: no dep-vulnerability gate existed (7c dependency audit).
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: hygiene gates (paths + AI artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keeps the tree free of machine-specific absolute paths and
      # AI-agent artifacts (unexplained external project names, agent
      # scratch paths) — the classes a code review easily misses. The
      # script self-tests both directions on every run.
      - run: shellcheck -S warning scripts/check_hygiene.sh
      - run: sh scripts/check_hygiene.sh
