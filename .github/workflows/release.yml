name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml caps jobs at 2 for the 13 GiB dev box; CI runners have 4 cores.
  CARGO_BUILD_JOBS: "4"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35 floor (ubuntu-22.04). Older glibc / Alpine -> musl assets.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, smoke: true }
          # Cross C deps (ring compiles C/asm sources and needs a target
          # sysroot): the cross images carry the full toolchain + libc
          # headers, where hand-rolled apt cross-gcc leaves them missing
          # and a glibc-compiled object linked into a static musl binary
          # segfaults at startup.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, cross: true, smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, cross: true, smoke: false }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04, cross: true, smoke: false }
          # 32-bit ARM boards (Pi 3/4 on 32-bit OS etc.): musl for old-libc freedom.
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-22.04, cross: true, smoke: false }
          - { target: x86_64-apple-darwin, os: macos-14, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-14, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
          # Windows on ARM: MSVC ARM64 build tools ship on GH runners; exe not
          # runnable on the x64 host, so no smoke.
          - { target: aarch64-pc-windows-msvc, os: windows-latest, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install apt packages
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Add Rust target
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "$target"
          else
            cargo build --release --locked --target "$target"
          fi

      - name: Smoke
        if: matrix.smoke == true
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/blazar"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --help > /dev/null

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          target="${{ matrix.target }}"
          stage="$(mktemp -d)/stage"
          mkdir -p "$stage"
          cp "target/$target/release/blazar" "$stage/"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          # Flat root: blazar + LICENSE-* directly inside the archive.
          tar -czf "blazar-$tag-$target.tar.gz" -C "$stage" .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $stage = Join-Path $env:RUNNER_TEMP "blazar-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/blazar.exe" $stage
          Copy-Item LICENSE-MIT, LICENSE-APACHE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "blazar-$tag-$target.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: blazar-${{ matrix.target }}
          path: blazar-*.*
          if-no-files-found: error

  # Release gate: a tag must not ship binaries (or crates) unless the
  # full suite is green at the tagged commit. ci.yml only fires on
  # branch pushes and PRs — tags never reach it — so this job re-runs
  # the same commands here. Ubuntu alone: the tagged commit always
  # landed on main first, where the 3-OS matrix already covered the
  # platform-specific paths.
  checks:
    name: fmt + clippy + tests (release gate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
        shell: bash
      - name: upload clippy log (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-clippy
          path: clippy.log
          if-no-files-found: ignore
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace 2>&1 | tee test.log
        shell: bash
      - name: upload test log (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-test
          path: test.log
          if-no-files-found: ignore
      - name: Docs site version matches the tag
        run: python3 scripts/sync_docs_version.py --check --expect "${GITHUB_REF_NAME#v}"

  release:
    needs: [build, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job: tell gh which repo to talk to instead
          # of letting it fall back to `git` discovery (which fails here)
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## Install

          Linux / macOS (WSL included):

              curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$GITHUB_REF_NAME/scripts/install.sh | BLAZAR_REPO=${GITHUB_REPOSITORY} sh

          (or clone and run \`sh scripts/install.sh --build\` to compile from source)

          Windows (PowerShell):

              irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$GITHUB_REF_NAME/scripts/install.ps1 | iex

          Installers verify each asset's sha256 against the GitHub release metadata
          before installing (the same mechanism as \`blazar engine update\`).

          ## What's inside

          One static-or-gnu \`blazar\` binary per target plus license texts. The
          inference engine (\`llama-server\`) is NOT bundled: run
          \`blazar engine update\` after install to fetch the official upstream
          build for your GPU.
          EOF
          # Idempotent publish: a re-run (re-run-failed-jobs or a fresh run on
          # the same tag) must not die on "a release with the same tag name
          # already exists" — that stranded v0.12.0 with a published release
          # and zero assets. If the object exists, clobber-upload into it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes
          fi
          # Re-pushing a tag (delete + re-create) drops the existing
          # release to DRAFT on GitHub's side, and the clobber-upload
          # branch above never re-publishes it. Heal the flags
          # unconditionally — idempotent on the happy path. Latest is
          # claimed only when this tag is the repo's newest, so healing
          # an old tag cannot steal the marker from a newer release.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          newest="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/v||' | sort -V | tail -1)"
          if [ "$GITHUB_REF_NAME" = "v$newest" ]; then
            gh release edit "$GITHUB_REF_NAME" --latest
          fi

  # crates.io update rides the same chain: tag == workspace version,
  # suite green (via release gate above), then publish in dependency
  # order. Idempotent on re-runs — if the version is already on the
  # registry (same philosophy as the clobber-upload release logic), the
  # publish step skips instead of failing the re-run.
  publish-crates:
    name: publish crates.io
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="blazar") | .version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            echo "bump the workspace version before tagging" >&2
            exit 1
          fi
          echo "releasing blazar $version to crates.io"
      - name: Skip if this version is already published
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            # Absent credential is an operator choice, not a release
            # failure: skip loudly (warning annotation + env marker so
            # the publish step no-ops) instead of failing the run.
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set — skipping crates.io publish. Add it under Settings > Secrets and variables > Actions and re-run this job to publish blazar $tag."
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
            exit 0
          fi
          current="$(curl -sf -A "blazar-release" https://crates.io/api/v1/crates/blazar | jq -r '.crate.max_stable_version')" || current="none"
          if [ "$current" = "$tag" ]; then
            echo "blazar $tag is already the newest crate on crates.io — skipping publish"
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi
      - name: Publish (core -> runtime -> gateway -> blazar)
        if: env.SKIP_PUBLISH != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          # Per-crate idempotency: a partially-completed earlier run may
          # have already uploaded the leading crates. Only the explicit
          # "already uploaded" outcome is tolerated — every other
          # failure prints the full log and fails the job.
          publish_crate() {
            name="$1"
            if cargo publish -p "$name" > "/tmp/publish-$name.log" 2>&1; then
              echo "published $name"
            elif grep -qE "already (uploaded|exists on crates\.io)" "/tmp/publish-$name.log"; then
              echo "::warning::$name $tag is already on crates.io — skipping"
            else
              cat "/tmp/publish-$name.log"
              exit 1
            fi
          }
          publish_crate blazar-core
          # the registry index needs a moment before downstream crates resolve it
          sleep 45
          publish_crate blazar-runtime
          sleep 45
          publish_crate blazar-gateway
          sleep 45
          publish_crate blazar

  # Real-OS validation of the just-published installers: download via the
  # GitHub API, sha256-verify, extract, PATH, service lane. Engine
  # bootstrap stays off (BLAZAR_INSTALL_ENGINE=0): the engine vendor
  # matrix has its own coverage; this job proves the INSTALLER lanes.
  installer-smoke:
    name: installer smoke (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # GitHub computes asset digests a short while after upload; the
      # installers refuse unverified downloads, so retry through the race.
      - name: Install (sh)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BLAZAR_REPO: ${{ github.repository }}
          BLAZAR_INSTALL_ENGINE: '0'
          # Authenticated API: shared runner IPs burn the anonymous
          # 60/hr GitHub quota and the release lookup 403s.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4; do
            if sh scripts/install.sh; then break; fi
            if [ "$i" = 4 ]; then exit 1; fi
            echo "retry $i/3 (asset digests may still be computing)"
            sleep 30
          done
          # install.sh installs to /usr/local/bin (no user-local
          # fallback by policy — F161: the old ~/.local/bin PATH export
          # pointed at a location the installer no longer uses).
          command -v blazar
          blazar --version
      - name: Install (ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BLAZAR_INSTALL_ENGINE: '0'
          # Same anonymous-quota protection as the sh smoke above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i = 1; $i -le 4; $i++) {
            # Child pwsh: the installer's Fail() exits its session, a
            # plain call would take this step down with it.
            pwsh -NoProfile -File scripts/install.ps1 -Repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 4) { exit 1 }
            Write-Host "retry $i/3 (asset digests may still be computing)"
            Start-Sleep -Seconds 30
          }
          & "$env:LOCALAPPDATA\Programs\blazar\blazar.exe" --version

  # The release is not done when the pipeline goes green — it is done
  # when the PUBLIC surfaces carry the new version. This job checks the
  # three publication planes from the outside, exactly like a user
  # would see them: crates.io registry state, the GitHub release flags,
  # and the live Pages site. Any stale surface fails the run loudly
  # instead of shipping a release the repo forgot to propagate.
  verify-publication:
    name: verify publication (crates + release + pages)
    needs: [release, publish-crates, installer-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify crates.io carries the tag
        env:
          CRATES: 'blazar-core blazar-runtime blazar-gateway blazar'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for name in $CRATES; do
            ok=0
            for i in $(seq 1 30); do
              current="$(curl -sf -A "blazar-release-check" \
                "https://crates.io/api/v1/crates/$name" \
                | jq -r '.crate.max_stable_version')" || current="none"
              if [ "$current" = "$tag" ]; then
                echo "crates.io: $name $tag OK"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then
              echo "::error::crates.io still serves $name $current — expected $tag"
              exit 1
            fi
          done
      - name: Verify the GitHub release is published and latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft | grep -q true; then
            echo "::error::release $tag is still a draft"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          latest="$(gh api graphql -f query="query { repository(owner:\"$owner\", name:\"$name\") { latestRelease { tagName } } }" \
            --jq .data.repository.latestRelease.tagName)"
          if [ "$latest" != "$tag" ]; then
            echo "::error::latest release is $latest — expected $tag"
            exit 1
          fi
          echo "release $tag: published + latest OK"
      - name: Verify the Pages site carries the tag
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          for i in $(seq 1 30); do
            if curl -sf "$site" | grep -qE "v${GITHUB_REF_NAME#v}\b"; then
              echo "pages: $site serves v${GITHUB_REF_NAME#v} OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$site does not mention v${GITHUB_REF_NAME#v} — docs sync or Pages build lagged; run scripts/sync_docs_version.py and check the Pages deployment"
          exit 1
