name: sglang-upstream-watch

# DSpine reaches Blazar's sglang lane as a first-class spec mode today
# via the version-pinned sglang-dspine plugin lane (venv-per-tag pip
# extra, `blazar engine install <ver> --kind sglang --with ...`). The
# day upstream sglang ships DSPINE natively in SpeculativeAlgorithm,
# the stock lane's manifest probe picks it up with zero source changes
# and the plugin lane becomes prunable. This watch files the issue that
# starts that cleanup so it does not depend on someone remembering to
# look. Green and silent when nothing changed; every issue path is
# deduped against open issues so weekly reruns stay idempotent.
on:
  schedule:
    # Weekly, Monday 04:00 UTC - quiet window for all timezones.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: DSPINE upstream + plugin pin drift
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The plugin lane this repo documents pins this sglang version
      # (docs/engines.md, sglang-dspine plugin lane). When the plugin's
      # own pin moves past it, the lane can rebase to a newer venv.
      KNOWN_PLUGIN_PIN: "0.5.22"
    steps:
      - name: DSPINE in upstream SpeculativeAlgorithm?
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/sgl-project/sglang/main/python/sglang/srt/speculative/spec_info.py"
          if ! curl -fsSL "$url" -o spec_info.py; then
            title="sglang upstream watch: spec_info.py moved"
            open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq '.[0].number // empty')"
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
                "The upstream watch URL 404s - sglang renamed or moved
                $url
                Update this workflow's URL to the new path; nothing else
                is affected."
            fi
            exit 0
          fi
          if grep -qE '\bDSPINE\b' spec_info.py; then
            title="DSPINE is upstream in sglang - prune the plugin lane"
            open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq '.[0].number // empty')"
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
                "Upstream sglang main now registers DSPINE in
                SpeculativeAlgorithm (python/sglang/srt/speculative/spec_info.py).
                Blazar needs zero source changes: the stock lane manifest
                probe (probe_version 3+) already discovers plugin and
                native algorithms alike, spec = \"dspine\" resolves against
                the catalog pair, and the capability gate turns green on
                the first stock lane that carries it. Cleanup that can
                follow once a released sglang version ships it: drop the
                plugin-lane install example from docs/engines.md and
                simplify registry/draft-pairings.json wording from
                \"native upstream or plugin lane\" to the stock lane."
            fi
          fi
      - name: SpeculativeAlgorithm enum drift
        run: |
          set -euo pipefail
          # SpeculativeAlgorithm members on upstream main as of this
          # watch's last update (2026-11-10, incl the internal
          # _DRAFT/_VERIFY/_STATE variants and PP_SPEC_RELAY). New
          # members mean the speculative surface moved - user-drivable
          # algorithms need one knob-arm spelling in
          # push_sglang_speculative + a catalog draft pair; internal
          # variants may change probe payload shape. DSPINE is excluded
          # here because the dedicated step above owns its story.
          known="DFLASH DFLASH_DRAFT DSPARK DFLASH_VERIFY EAGLE EAGLE3 EAGLE_DRAFT EAGLE_DRAFT_EXTEND EAGLE_VERIFY FROZEN_KV_MTP FROZEN_KV_MTP_DRAFT FROZEN_KV_MTP_VERIFY NGRAM NGRAM_VERIFY STANDALONE UNO UNO_STATE UNO_DRAFT UNO_VERIFY PP_SPEC_RELAY"
          # spec_info.py was fetched by the previous step; re-fetch here
          # so this step also stands alone under workflow_dispatch.
          url="https://raw.githubusercontent.com/sgl-project/sglang/main/python/sglang/srt/speculative/spec_info.py"
          curl -fsSL "$url" -o spec_info.py || exit 0
          got="$(grep -oE '^[[:space:]]+[A-Z][A-Z0-9_]*[[:space:]]*=' spec_info.py \
            | sed 's/[[:space:]=]//g' | grep -vx NONE | grep -vx DSPINE | sort -u || true)"
          gained="$(comm -13 <(printf '%s\n' $known | tr ' ' '\n' | sort -u) <(printf '%s\n' "$got"))"
          if [ -n "$gained" ]; then
            list="$(printf '%s ' $gained | sed 's/ $//')"
            title="sglang speculative enum gained: $list"
            open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq '.[0].number // empty')"
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
                "Upstream SpeculativeAlgorithm gained: $list.
                The lane manifest probe picks the names up automatically on
                the next engine update (probe discovers enum + plugin
                registry alike), but each new algorithm still needs a
                spec-mode spelling in push_sglang_speculative and a catalog
                draft pair before spec = <mode> resolves. Add the arm,
                pin its tests, and refresh the spec-race receipts."
            fi
          fi
      - name: sglang-dspine plugin pin drift
        run: |
          set -euo pipefail
          if ! curl -fsSL "https://raw.githubusercontent.com/Tencent/DSpine/main/pyproject.toml" -o dspine-pyproject.toml; then
            exit 0  # repo moved/renamed: the DSPINE-upstream step owns the story
          fi
          pin="$(grep -oE 'sglang[[:space:]]*==[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' dspine-pyproject.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -n "$pin" ] && [ "$pin" != "$KNOWN_PLUGIN_PIN" ]; then
            title="sglang-dspine plugin pin moved to $pin - lane can rebase"
            open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title" --json number --jq '.[0].number // empty')"
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
                "Tencent/DSpine now pins sglang == $pin (was $KNOWN_PLUGIN_PIN).
                The documented plugin-lane install can move to a
                sglang-$pin venv; lane installs are independent
                (venv-per-tag), so nothing migrates - update
                docs/engines.md and re-validate with the spec-race
                receipts on the new lane."
            fi
          fi
