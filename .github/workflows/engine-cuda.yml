name: engine-cuda

# Prebuilt CUDA channel for the llama.cpp engine: compiles the UPSTREAM
# ggml-org/llama.cpp source at a b-tag with -DGGML_CUDA=ON against CUDA
# 12 and CUDA 13 toolkit images, bundles the NVIDIA runtime libraries
# (cudart/cublas/cublasLt) plus their EULAs, and publishes the archives
# as `bNNNN-cuda` releases on THIS repository. Pallama's engine lane
# picks them up automatically on Linux-NVIDIA boxes whose driver can
# run the toolkit version (zero-touch: the overlay home defaults to
# santanu20/pallama — flip ENGINE_OVERLAY_REPO_DEFAULT in gh.rs if the
# project repo moves; PALLAMA_ENGINE_REPO=owner/repo points at forks).
#
# No source fork: every build checks out the pristine upstream tarball.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream b-tag to build (e.g. b10896). Empty = newest."
        required: false
        default: ""
      architectures:
        description: "CMAKE_CUDA_ARCHITECTURES override (semicolon list). Empty = per-major default."
        required: false
        default: ""
  schedule:
    # Weekly probe for a new upstream b-tag (idempotent: re-uploading
    # an existing bNNNN-cuda release only refreshes its assets).
    - cron: "0 5 * * 1"

permissions:
  contents: write

env:
  UPSTREAM_REPO: ggml-org/llama.cpp

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve upstream b-tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            # Newest b-tag from upstream releases (prereleases included).
            tag="$(gh api "repos/${UPSTREAM_REPO}/releases" --paginate -q '.[].tag_name | select(startswith("b"))' | head -1)"
          fi
          case "$tag" in
            b*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) echo "no b-tag resolved (input: '$INPUT_TAG')" >&2; exit 1 ;;
          esac

  build:
    needs: resolve
    name: cuda ${{ matrix.cuda }} sm${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PER-ARCH channel: each job builds exactly ONE architecture
          # (SASS-only via `-real`) and ships its own slim asset —
          # llama-bNNNN-bin-ubuntu-cuda-{X.Y}-sm{NN}-x64.tar.gz — so a
          # user downloads only their GPU's kernels (~60% size cut vs
          # the fat build) and all arch jobs compile in parallel.
          # sm120 is the exception: PLAIN (SASS+PTX) so its PTX ships
          # and future GPUs JIT forward from it.
          # Arch floors: CUDA 13 dropped sm<75 (Turing); Blackwell
          # (sm_100/120) needs 12.8+. Datacenter 80/90/100 and Volta 70
          # stay on the source lane (`pallama engine build cuda`).
          # The client resolver ranks: exact-sm slim > legacy fat asset
          # (transition releases) > sm120 PTX for GPUs newer than 120.
          # CMake grammar (verified 3.28.3): plain = SASS+PTX, -real =
          # SASS only. Dispatch `architectures` input still overrides.
          - { cuda: "12.8.1", arch: "61" }
          - { cuda: "12.8.1", arch: "75" }
          - { cuda: "12.8.1", arch: "86" }
          - { cuda: "12.8.1", arch: "89" }
          - { cuda: "12.8.1", arch: "120" }
          - { cuda: "13.0.0", arch: "75" }
          - { cuda: "13.0.0", arch: "86" }
          - { cuda: "13.0.0", arch: "89" }
          - { cuda: "13.0.0", arch: "120" }
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu24.04
    env:
      ARCH: ${{ matrix.arch }}
      # Job-level so the configure step's -DLLAMA_BUILD_* derivation can
      # see it (run 34783837345: step-local TAG made ${TAG#b} expand
      # empty and the generated build-info.cpp failed to compile).
      TAG: ${{ needs.resolve.outputs.tag }}
      OVERRIDE_ARCHES: ${{ github.event.inputs.architectures }}
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils zip python3 pip git ccache
          # --break-system-packages: Ubuntu noble's PEP 668 guard blocks
          # system-wide pip in the CUDA devel container; the container is
          # disposable so the guard buys nothing here.
          pip install --break-system-packages --no-cache-dir cmake==3.28.3

      # Rolling compiler cache: keys on run_number so every run saves a
      # fresh entry, restore-keys prefix makes the PREVIOUS run's cache
      # the hit — unchanged files skip nvcc/gcc entirely. A failed-run
      # retry or a one-tag-forward rebuild compiles only what changed
      # (measured locally: repeat CUDA builds drop from ~50 min to
      # single-digit minutes of actual compilation).
      - name: ccache (compiler cache)
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-cuda${{ matrix.cuda }}-sm${{ matrix.arch }}-${{ github.run_number }}
          restore-keys: |
            ccache-cuda${{ matrix.cuda }}-sm${{ matrix.arch }}-

      - name: Fetch upstream source (${{ needs.resolve.outputs.tag }})
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          curl -fsSL "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${TAG}.tar.gz" -o src.tar.gz
          mkdir -p src && tar -xzf src.tar.gz -C src --strip-components=1

      - name: Build llama-server + ggml-rpc-server (CUDA ON)
        run: |
          # cuMem*/cuGetErrorString are CUDA DRIVER API symbols. Upstream
          # links CUDA::cuda_driver into libggml-cuda (VMM), but the
          # GPU-less CI container has no libcuda.so.1 — only toolkit
          # stubs off the default link path — so the .so is created with
          # unresolved driver symbols and the final exe link fails.
          # Placing the stub in the default linker path lets CMake link
          # it properly. Stub SONAME is libcuda.so.1, so the NEEDED
          # entry resolves against the real driver on user machines.
          # Never bundle the real libcuda.
          cp /usr/local/cuda/lib64/stubs/libcuda.so /usr/lib/x86_64-linux-gnu/libcuda.so.1
          export CCACHE_DIR=/tmp/ccache
          # One arch per job: SASS-only (-real); sm120 plain so its PTX
          # ships for forward JIT. Dispatch override wins (fat rebuild).
          if [ -n "$OVERRIDE_ARCHES" ]; then
            arches="$OVERRIDE_ARCHES"
          elif [ "$ARCH" = "120" ]; then
            arches="120"
          else
            arches="${ARCH}-real"
          fi
          cmake -S src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_RPC=ON \
            -DCMAKE_CUDA_ARCHITECTURES="$arches" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON \
            -DGGML_CUDA_F16=ON \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_NUMBER="${TAG#b}" \
            -DLLAMA_BUILD_COMMIT="$TAG"
          # ^ Checkout-less tarball builds have no git context, so upstream
          # defaults the version banner to "build 0, commit unknown";
          # NOT-DEFINED guards make both overridable at configure time.
          # ggml-rpc-server ships in upstream prebuilt assets; a
          # server-only build breaks the runtime's rpc override leg.
          cmake --build build --config Release -j"$(nproc)" --target llama-server ggml-rpc-server
          ccache -s || true

      - name: Smoke (--help, CUDA device probe is driver-less in CI)
        run: |
          # The copied stub libcuda.so.1 satisfies the dynamic loader for
          # the NEEDED entry; CUDA probes degrade to "no device" cleanly.
          find build/bin -name 'llama-server*' -type f | head
          "$(find build/bin -name 'llama-server' -type f | head -1)" --version

      - name: Package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CUDA_VER: ${{ matrix.cuda }}
        run: |
          # Asset label carries the toolkit X.Y the driver gate keys on
          # plus the per-arch -smNN the client resolver ranks on.
          ver="$(echo "$CUDA_VER" | cut -d. -f1,2)"
          stage="$(mktemp -d)/llama-${TAG}-bin-ubuntu-cuda-${ver}-sm${ARCH}-x64"
          mkdir -p "$stage"
          bin="$(find build/bin -name 'llama-server' -type f | head -1)"
          install -m 0755 "$bin" "$stage/"
          rpc="$(find build/bin -name 'ggml-rpc-server' -type f | head -1)"
          [ -n "$rpc" ] || { echo "ggml-rpc-server not built" >&2; exit 1; }
          install -m 0755 "$rpc" "$stage/"
          # Shared ggml/llama/aux libs (flat: the engine dir is the
          # runtime's LD_LIBRARY_PATH root) + the NVIDIA runtime libs the
          # binary links against, straight from the devel image. Globs,
          # NOT a fixed list: upstream keeps adding linkdeps (libmtmd
          # arrived ~b10940 — run 9's probe died on its absence).
          for lib in build/bin/*.so build/bin/*.so.*; do
            [ -e "$lib" ] || continue
            install -m 0755 "$lib" "$stage/"
          done
          for rt in libcudart.so libcublas.so libcublasLt.so libnccl.so; do
            # ldd resolves to the REAL file behind any symlink chain —
            # devel-image entries are symlinks, so find -type f sees
            # nothing (run-4 lesson). find -L kept as fallback.
            src="$(ldd build/bin/llama-server build/bin/libggml-cuda*.so* 2>/dev/null \
                   | grep -o "/[^ ]*${rt}\.[0-9][^ ]*" | sort -u | head -1)"
            [ -n "$src" ] || src="$(find -L /usr/local/cuda/lib64 /usr/lib/x86_64-linux-gnu \
                   -maxdepth 1 -name "${rt}.*" -type f 2>/dev/null | sort -V | tail -1)"
            [ -n "$src" ] || { echo "$rt not found via ldd or find" >&2; exit 1; }
            install -m 0755 "$src" "$stage/"
          done
          # EULA/attribution texts: redistribution obligations.
          cp -r /usr/local/cuda/doc /tmp/cuda-doc 2>/dev/null || true
          for f in /usr/local/cuda/doc/EULA.txt /usr/local/cuda/README /opt/nvidia/entropy/nvidia_end_user_license_agreement.txt; do
            [ -f "$f" ] && cp "$f" "$stage/" || true
          done
          # POSIX-sh guards (compgen is a bash builtin; GH steps run dash).
          set -- "$stage"/libcudart*
          [ -e "$1" ] || { echo "libcudart not bundled" >&2; exit 1; }
          set -- "$stage"/libcublas.so*
          [ -e "$1" ] || { echo "libcublas not bundled" >&2; exit 1; }

          # Devel-leak guard (nccl-class misses), run under the SAME
          # loader contract as the pallama runtime: the engine dir is the
          # child's LD_LIBRARY_PATH root, so staged libs win resolution
          # exactly as they will on user machines. Bare `ldd` would use
          # only RUNPATH/ld.so.cache semantics and false-positive on
          # devel-image paths (run 13). Under the real contract, a devel
          # path appearing STILL means a genuinely unbundled dep, and a
          # "not found" means the stage is incomplete — both fail HERE,
          # not at user probe.
          guard=0
          for f in "$stage"/llama-server "$stage"/ggml-rpc-server "$stage"/*.so*; do
            out="$(LD_LIBRARY_PATH="$stage" ldd "$f" 2>/dev/null || true)"
            bad="$(printf '%s\n' "$out" | grep -oE '/usr/local/cuda[^ ]*|/opt/[^ ]*' | sort -u || true)"
            if [ -n "$bad" ]; then
              echo "unbundled devel-image libs in $(basename "$f"):" $bad >&2
              guard=1
            fi
            if printf '%s\n' "$out" | grep -q 'not found'; then
              echo "$(basename "$f") unresolved under stage LD_LIBRARY_PATH:" >&2
              printf '%s\n' "$out" | grep 'not found' >&2
              guard=1
            fi
          done
          [ "$guard" -eq 0 ] || exit 1
          # Canonical asset name (gh.rs resolve_cuda_asset grammar):
          # llama-bNNNN-bin-ubuntu-cuda-{X.Y}-sm{NN}-x64.tar.gz — a
          # generic name made matrix jobs collide into one overwritten
          # file at release-upload time (run 7 shipped a single
          # `asset.tar.gz`); the -smNN suffix keeps per-arch jobs unique.
          ver="${CUDA_VER%.*}"
          asset="llama-${TAG}-bin-ubuntu-cuda-${ver}-sm${ARCH}-x64.tar.gz"
          tar -C "$(dirname "$stage")" -czf "$asset" "$(basename "$stage")"

      - uses: actions/upload-artifact@v4
        with:
          name: cuda-${{ matrix.cuda }}-sm${{ matrix.arch }}
          path: llama-*-bin-ubuntu-cuda-*-sm*-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to bNNNN-cuda release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: santanu20/pallama
        run: |
          rel="${TAG}-cuda"
          # This job has NO checkout — every gh call needs --repo (gh
          # otherwise resolves context from git and dies). Notes ride in a
          # quoted heredoc: backticks inside a double-quoted shell string
          # are COMMAND SUBSTITUTION (run 6: `pallama ...` executed and
          # printed "pallama: command not found" into the notes).
          read -r -d '' notes <<EOF || true
          Prebuilt CUDA llama-server for upstream ${TAG}.

          Compiled from the pristine ggml-org/llama.cpp ${TAG} source
          (-DGGML_CUDA=ON; one slim asset per consumer GPU arch
          (-smNN, SASS only), plus an sm120 build carrying PTX for
          forward JIT onto future GPUs; datacenter archs: build locally
          via \`pallama engine build cuda\`). Bundles
          libcudart/libcublas/libcublasLt plus NVIDIA EULA texts — no
          CUDA toolkit install needed on the target machine; the NVIDIA
          driver alone must support the asset's CUDA version.

          Install lane: pallama engine update prefers this channel
          automatically on Linux-NVIDIA (highest ubuntu-cuda-{X.Y}-x64
          asset the local driver can run; PALLAMA_ENGINE_REPO overrides
          the default home for forks).
          EOF
          # gh release create fails on an existing release — create only
          # when missing, then upload with --clobber so re-runs refresh
          # assets (digests recompute on GitHub's side automatically).
          gh release view "$rel" --repo "$REPO" \
            || gh release create "$rel" --repo "$REPO" \
              --title "$rel" --notes "$notes"
          gh release upload "$rel" dist/* --clobber --repo "$REPO"
