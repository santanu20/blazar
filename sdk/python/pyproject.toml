[project]
name = "blazar"
version = "0.1.0"
description = "Zero-dependency Python client for Blazar, the local model server"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Blazar contributors" }]
keywords = ["llm", "local", "inference", "blazar", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/santanu20/blazar"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blazar"]
