# winget manifest template for pallama.
# Publishing: winget-pkgs PR (or your own repo). Fill Version
# + InstallerSha256 per release; the asset is the same Windows zip the
# install.ps1 channel uses.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.6.0.schema.json
PackageIdentifier: santanu20.pallama
PackageVersion: VERSION
PackageName: pallama
Publisher: santanu20
License: MIT OR Apache-2.0
ShortDescription: Multi-engine local inference server (OpenAI, ollama, Anthropic APIs)
PackageUrl: https://github.com/santanu20/pallama
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/santanu20/pallama/releases/download/VERSION/pallama-VERSION-x86_64-pc-windows-msvc.zip
    InstallerSha256: FILL_PER_RELEASE
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: pallama.exe
        PortableCommandAlias: pallama
ManifestType: singleton
ManifestVersion: 1.6.0
