[package]
name = "blazar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blazar pure domain core: config, store, catalog, gguf, profile compiler"
repository = "https://github.com/santanu20/blazar"
homepage = "https://github.com/santanu20/blazar"
readme = "README.md"
keywords = ["llm", "gguf", "config", "catalog", "model"]
categories = ["config", "science"]

[features]
test-util = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
# Ring-only rustls: powers the process-wide TLS provider bootstrap in
# `tls` (see the workspace axum-server entry for why provider-less).
rustls = { workspace = true }

[dev-dependencies]
tempfile = "3"
iai-callgrind = { workspace = true }

[[bench]]
name = "micro"
harness = false

[lints]
workspace = true
