[package]
name = "blazar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The control plane for local AI inference: one Rust binary uniting OpenAI, Ollama, and Anthropic APIs over llama.cpp, mistral.rs, SGLang, and MLX engines, with resource-aware orchestration and multimodal serving"
repository = "https://github.com/santanu20/blazar"
homepage = "https://santanu20.github.io/blazar/"
documentation = "https://santanu20.github.io/blazar/"
readme = "../../README.md"
keywords = ["llm", "inference", "ollama", "openai", "local-ai"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "blazar"
path = "src/main.rs"

[features]
default = []
test-util = []

[dependencies]
blazar-core = { workspace = true }
blazar-runtime = { workspace = true }
blazar-gateway = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
base64 = "0.23"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rustyline = { workspace = true }
indicatif = { workspace = true }
# width-aware doctor tables; already compiled in via indicatif, this
# only makes the terminal-size API a direct dependency
console = "0.16"
futures = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }

sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
flate2 = { workspace = true }
tar = { workspace = true }
predicates = "3"

[lints]
workspace = true
