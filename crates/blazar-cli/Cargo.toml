[package]
name = "blazar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "blazar binary: multi-engine local inference platform (llama.cpp, mistral.rs, SGLang) CLI and daemon"

[[bin]]
name = "blazar"
path = "src/main.rs"

[features]
default = []
test-util = []

[dependencies]
blazar-core = { workspace = true }
blazar-runtime = { workspace = true }
blazar-gateway = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
base64 = "0.23"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rustyline = { workspace = true }
indicatif = { workspace = true }
# width-aware doctor tables; already compiled in via indicatif, this
# only makes the terminal-size API a direct dependency
console = "0.16"
futures = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }

sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
flate2 = { workspace = true }
tar = { workspace = true }
predicates = "3"

[lints]
workspace = true
